name: Release

# Push a tag like v1.0.0 to build Dokr.dmg, publish it as a release on the
# public tap repo (uraxdev/homebrew-tap) under the tag dokr-vX.Y.Z (prefixed,
# since the tap hosts releases for several apps), and bump Casks/dokr.rb there.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Bundle app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Publish release to public tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          gh release create "dokr-$GITHUB_REF_NAME" build/Dokr.dmg \
            --repo uraxdev/homebrew-tap \
            --title "Dokr ${GITHUB_REF_NAME#v}" \
            --notes "Dokr ${GITHUB_REF_NAME#v}"

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 build/Dokr.dmg | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/uraxdev/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/dokr.rb
          git config user.name "Seif Eldeen Essam"
          git config user.email "info@seifessam.com"
          git commit -am "dokr ${VERSION}"
          git push
