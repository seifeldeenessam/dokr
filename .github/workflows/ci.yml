name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Bundle app
        run: UNIVERSAL=1 ./scripts/bundle.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Dokr.app build/Dokr.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dokr
          path: build/Dokr.zip
